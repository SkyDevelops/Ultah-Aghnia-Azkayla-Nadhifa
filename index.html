<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="description" content="Undangan Ulang Tahun Kayla yang ke-2 — Tema Baby Shark! Pilih namamu dan masuk ke pesta bawah laut!" />
  <title>🦈 Baby Shark! Undangan Ulang Tahun Kayla</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦈</text></svg>" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/guest.css" />
</head>
<body>

<!-- Loading Screen -->
<div class="loading-screen" id="loadingScreen">
  <span class="loading-icon">🦈</span>
  <p class="loading-text">Menyelam ke pesta...</p>
</div>

<!-- Bubble Canvas -->
<canvas id="confetti-canvas"></canvas>

<!-- Floating Bubbles Background -->
<div class="floating-bg" aria-hidden="true">
  <div class="float-shape"></div>
  <div class="float-shape"></div>
  <div class="float-shape"></div>
  <div class="float-shape"></div>
  <div class="float-shape"></div>
  <div class="float-shape"></div>
</div>

<!-- Main Page -->
<main class="guest-page page-enter" id="mainPage" style="display:none">

  <!-- Hero Header -->
  <header class="guest-hero">
    <div class="hero-sea-creatures" aria-hidden="true">
      <span>🦈</span>
      <span>🐠</span>
      <span>🐙</span>
      <span>🐟</span>
      <span>🐚</span>
    </div>
    <h1 class="guest-hero-title">
      <span class="title-accent">Baby Shark!</span><br>
      Kayla's Birthday 🎂
    </h1>
    <p class="guest-hero-sub">doo doo doo doo doo doo ~ Selamat datang di pesta bawah laut!</p>
    <div class="age-badge">⭐ 2 Tahun Yang Luar Biasa! ⭐</div>
  </header>

  <!-- Instruction -->
  <div class="guest-instruction">
    <p>
      <span>🫧</span>
      Masukkan nama dan alamat Anda untuk menyelam ke pesta!
    </p>
  </div>

  <!-- Profile Form -->
  <div class="search-wrapper" style="max-width: 480px; margin: 0 auto 40px;">
    <form id="profileForm" autocomplete="off" class="guest-form" style="display: flex; flex-direction: column; gap: 16px; background: white; padding: 28px; border-radius: var(--radius); box-shadow: 0 8px 32px rgba(10,38,71,0.1); border: 2.5px solid rgba(0,188,212,0.25);">
      <div class="form-group" style="text-align: left; margin-bottom: 0;">
        <label class="form-label" for="guestNameInput" style="display: block; font-size: 0.8rem; font-weight: 700; color: var(--text-light); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;">Nama Lengkap / Panggilan</label>
        <div style="position: relative; display: flex; align-items: center;">
          <span style="position: absolute; left: 16px; font-size: 1.1rem; pointer-events: none;">🦈</span>
          <input type="text" id="guestNameInput" placeholder="Tulis nama Anda di sini..." required maxlength="50" style="width: 100%; padding: 14px 16px 14px 44px; background: var(--bg); border: 2px solid var(--aqua-light); border-radius: var(--radius-pill); font-family: var(--font-body); font-size: 0.95rem; color: var(--text); font-weight: 600; outline: none; transition: all 0.2s;" />
        </div>
      </div>
      <div class="form-group" style="text-align: left; margin-bottom: 0;">
        <label class="form-label" for="guestAddressInput" style="display: block; font-size: 0.8rem; font-weight: 700; color: var(--text-light); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;">Alamat Rumah / Kota Asal</label>
        <div style="position: relative; display: flex; align-items: center;">
          <span style="position: absolute; left: 16px; font-size: 1.1rem; pointer-events: none;">🏠</span>
          <input type="text" id="guestAddressInput" placeholder="Tulis alamat/kota Anda..." required maxlength="100" style="width: 100%; padding: 14px 16px 14px 44px; background: var(--bg); border: 2px solid var(--aqua-light); border-radius: var(--radius-pill); font-family: var(--font-body); font-size: 0.95rem; color: var(--text); font-weight: 600; outline: none; transition: all 0.2s;" />
        </div>
      </div>
      <button type="submit" class="submit-wish-btn" style="width: 100%; padding: 15px; background: linear-gradient(135deg, #0D47A1, #00BCD4); color: white; border: none; border-radius: var(--radius-pill); font-family: var(--font-body); font-weight: 800; font-size: 1rem; cursor: pointer; transition: all 0.25s cubic-bezier(.34,1.56,.64,1); box-shadow: 0 6px 20px rgba(0,188,212,0.35); display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 8px;">
        Masuk ke Pesta 🐬✨
      </button>
    </form>
  </div>

</main>

<!-- Footer -->
<footer class="guest-footer">
  <p>Dibuat dengan 🦈 untuk <strong>Kayla</strong> · Baby Shark Party!</p>
</footer>

<!-- Scripts -->
<script src="js/confetti.js"></script>
<script src="js/guest.js"></script>
</body>
</html>
